# Session store. No volume by design: a restart logs every user out.
# Generated from the live cluster by scripts/cluster/rentek-export-manifests.sh — do not hand-edit.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  labels:
    app: gx-redis-app
    genby: genexus
  name: gx-redis-app
  namespace: rentek
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: gx-redis-app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gx-redis-app
        genby: genexus
        tier: redis
    spec:
      containers:
      - image: redis:7.2.4-alpine
        imagePullPolicy: IfNotPresent
        name: gx-redis
        ports:
        - containerPort: 6379
          name: redis-port
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
